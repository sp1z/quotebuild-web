      var KEY_STORE = 'qb.unlock';
      var bytes = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };
      var form = document.getElementById('unlock');
      var msg = document.getElementById('msg');

      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

      function decrypt(key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data))
          .then(function (buf) { return new TextDecoder().decode(buf); });
      }

      function run(html) {
        document.open();
        document.write(html);
        document.close();
      }

      function getStored() {
        try { return localStorage.getItem(KEY_STORE); } catch (e) { return null; }
      }

      function showForm(text) {
        form.hidden = false;
        msg.textContent = text || '';
      }

      if (!window.crypto || !crypto.subtle) {
        showForm('This browser can\'t open QuoteBuild. Please update it, or open the link in Safari or Chrome.');
        document.getElementById('go').disabled = true;
        return;
      }

      // Already unlocked on this phone: open straight away (works with no signal).
      var stored = getStored();
      if (stored) {
        crypto.subtle.importKey('raw', bytes(stored), 'AES-GCM', false, ['decrypt'])
          .then(decrypt)
          .then(run, function () {
            try { localStorage.removeItem(KEY_STORE); } catch (e) {}
            showForm('The password has changed. Please enter the new one.');
          });
      } else {
        showForm();
      }

      form.onsubmit = function (e) {
        e.preventDefault();
        var btn = document.getElementById('go');
        btn.disabled = true;
        msg.textContent = 'Unlocking…';
        var raw;
        crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey'])
          .then(function (base) {
            return crypto.subtle.deriveKey(
              { name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iterations, hash: 'SHA-256' },
              base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
          })
          .then(function (key) {
            return crypto.subtle.exportKey('raw', key).then(function (r) { raw = r; return decrypt(key); });
          })
          .then(function (html) {
            try {
              localStorage.setItem(KEY_STORE, btoa(String.fromCharCode.apply(null, new Uint8Array(raw))));
            } catch (e) {}
            run(html);
          }, function () {
            btn.disabled = false;
            msg.textContent = 'Wrong password — try again.';
          });
      };
    })();
